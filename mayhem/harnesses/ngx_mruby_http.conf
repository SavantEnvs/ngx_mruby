# nginx configuration driven by mayhem/harnesses/ngx_mruby_http_fuzzer.c. The harness replaces @PREFIX@ with a
# scratch directory and feeds each fuzz input, as raw bytes, to the unix socket below. Every location runs
# ngx_mruby handlers over the parts of the request the client controls (request line, headers, args, body).
daemon off;
master_process off;
worker_processes 1;
pid @PREFIX@/nginx.pid;
error_log stderr emerg;

events {
    worker_connections 64;
}

http {
    access_log off;
    keepalive_timeout 0;
    lingering_close off;
    client_header_timeout 1s;
    client_body_timeout 1s;
    send_timeout 1s;
    client_max_body_size 64k;

    server {
        listen unix:@PREFIX@/ngx.sock;
        server_name fuzz.example;
        root @PREFIX@/html;

        mruby_post_read_handler_code '
          r = Nginx::Request.new
          r.headers_out["X-Post-Read"] = r.method
        ';

        location / {
            mruby_content_handler_code '
              r = Nginx::Request.new
              c = Nginx::Connection.new
              Nginx.rputs "#{r.method} #{r.uri} #{r.args} #{r.protocol} #{r.hostname} #{r.unparsed_uri}\n"
              Nginx.rputs "#{c.remote_ip}:#{c.remote_port} #{c.local_ip}:#{c.local_port}\n"
              r.headers_in.all.each { |k, v| Nginx.rputs "#{k}=#{v}\n" }
              r.headers_out["X-Echo"] = r.headers_in["X-Echo"] || r.var.arg_echo.to_s
              r.content_type = r.headers_in["Accept"] || "text/plain"
              r.headers_out.all.each { |k, v| Nginx.rputs "out #{k}=#{v}\n" }
              Nginx.return Nginx::HTTP_OK
            ';
        }

        location /vars {
            mruby_set_code $fuzz_var '
              v = Nginx::Var.new
              v.arg_name.to_s[0, 64] + ":" + v.http_user_agent.to_s[0, 64]
            ';
            mruby_content_handler_code '
              r = Nginx::Request.new
              name = r.var.arg_name.to_s
              Nginx.rputs "#{r.var.fuzz_var} #{r.var.exist?(name)} #{r.var.request_uri} #{r.var.query_string}\n"
              Nginx.rputs "#{r.var.send(name)}\n" if r.var.exist?(name)
              r.var.set "fuzz_var", r.var.arg_value.to_s
              Nginx.rputs r.var.fuzz_var.to_s
              Nginx.rputs "#{r.filename} #{r.user} #{r.authority} #{r.sub_request?}"
            ';
        }

        location /headers {
            mruby_access_handler_code '
              r = Nginx::Request.new
              name = r.var.arg_name.to_s
              r.headers_in[name] = r.var.arg_value.to_s if name.length > 0
              r.headers_in.delete(r.var.arg_del.to_s) if r.var.arg_del
              r.headers_out[name] = r.headers_in[name].to_s if name.length > 0
            ';
            mruby_content_handler_code '
              r = Nginx::Request.new
              r.headers_in.all.each { |k, v| r.headers_out["X-In-#{k}"] = v }
              r.headers_out.delete(r.var.arg_out.to_s)
              r.headers_out["Location"] = r.headers_in["Host"].to_s
              Nginx.rputs r.headers_out.all.to_s
              Nginx.return Nginx::HTTP_OK
            ';
        }

        location /access {
            mruby_access_handler_code '
              r = Nginx::Request.new
              if r.headers_in["Authorization"].to_s.length > 8
                Nginx.return Nginx::HTTP_FORBIDDEN
              end
              if r.var.arg_deny
                Nginx.return Nginx::HTTP_UNAUTHORIZED
              end
            ';
            return 200 "access ok";
        }

        location /rewrite {
            mruby_rewrite_handler_code '
              r = Nginx::Request.new
              if r.var.arg_url
                Nginx.redirect r.var.arg_url, (r.var.arg_code || "302").to_i
              elsif r.var.arg_uri
                r.uri = r.var.arg_uri
                r.args = r.var.arg_args.to_s
                r.method = r.var.arg_method.to_s if r.var.arg_method
              end
            ';
            return 200 "rewrite ok";
        }

        location /redirect {
            mruby_rewrite_handler_code '
              Nginx.redirect "/" + Nginx::Request.new.var.arg_to.to_s
            ';
        }

        location /post {
            mruby_enable_read_request_body on;
            mruby_content_handler_code '
              r = Nginx::Request.new
              r.read_body
              body = r.get_body.to_s
              Nginx.rputs "#{body.length} #{body.inspect}\n"
              Nginx.rputs body.split("&").map { |kv| kv.split("=", 2) }.to_s
            ';
        }

        location /filter {
            mruby_output_header_filter_code '
              r = Nginx::Request.new
              r.headers_out["X-Filter"] = r.var.args.to_s unless r.var.args.nil?
              r.headers_out.delete(r.var.arg_del.to_s) if r.var.arg_del
            ';
            mruby_output_body_filter_code '
              r = Nginx::Request.new
              f = Nginx::Filter.new
              f.body = "filtered: #{r.var.args.to_s}: #{f.body.to_s}"
            ';
            return 200 "origin body";
        }

        location /rack {
            mruby_content_handler_code '
              class FuzzRack
                def call(env)
                  keys = env.keys.sort.join(",")
                  status = (env["HTTP_X_STATUS"] || "200").to_i
                  status = 200 if status < 100 || status > 599
                  [status, {"x-keys" => keys, "x-qs" => env["QUERY_STRING"].to_s}, [env["PATH_INFO"].to_s, env["rack.input"].read.to_s]]
                end
              end
              run FuzzRack.new
            ';
        }

        location /log {
            mruby_log_handler_code '
              r = Nginx::Request.new
              Nginx.log Nginx::LOG_DEBUG, "#{r.method} #{r.uri} #{r.headers_out["X-Log"]}"
            ';
            mruby_content_handler_code '
              r = Nginx::Request.new
              r.headers_out["X-Log"] = r.var.arg_log.to_s
              Nginx.errlogger Nginx::LOG_DEBUG, r.var.arg_log.to_s
              Nginx.rputs "logged"
            ';
        }
    }
}
